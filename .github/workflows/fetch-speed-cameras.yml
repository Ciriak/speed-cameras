name: Fetch speed cameras

# Runs monthly and on demand. By default every country in config.json is
# fetched; a manual run can narrow that to one country code and can skip the
# commit.
#
# The refreshed datapacks are committed to the data repository
# (Ciriak/speed-cameras) through DATA_REPO_TOKEN, not to this worker repository.
on:
  workflow_dispatch:
    inputs:
      country_code:
        description: Two-letter ISO 3166-1 code, empty for all configured countries
        required: false
        default: ''
        type: string
      commit:
        description: Commit and push the refreshed data
        required: false
        default: true
        type: boolean
  schedule:
    # 03:17 UTC on the first day of every month.
    - cron: '17 3 1 * *'

permissions:
  contents: read

concurrency:
  group: fetch-speed-cameras
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch speed cameras (${{ inputs.country_code || 'all configured countries' }})
    runs-on: ubuntu-latest
    # A slow mirror can push the run past ten minutes; fail rather than hang.
    timeout-minutes: 30
    env:
      COUNTRY_CODE_INPUT: ${{ inputs.country_code || 'ch' }}
      # Optional repository variable, e.g. to pin a specific Overpass endpoint.
      OVERPASS_URL: ${{ vars.OVERPASS_URL }}
      # Optional repository variable, e.g. to point the `url` property at a CDN.
      UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
      # Repository holding the published datapacks, checked out next to the worker.
      DATA_REPO: Ciriak/speed-cameras
      # Optional repository variable overriding the branch pushed to.
      DATA_REPO_BRANCH: ${{ vars.DATA_REPO_BRANCH || 'master' }}
      DATA_REPO_DIR: data

    steps:
      - name: Check the data repository token
        env:
          # Fine-grained PAT with contents:write on DATA_REPO, stored as a secret.
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DATA_REPO_TOKEN:-}" ]; then
            echo "::error::DATA_REPO_TOKEN is not set: add a fine-grained personal access token with contents:write on ${DATA_REPO} as a repository secret."
            exit 1
          fi

      - name: Check out worker repository
        uses: actions/checkout@v5

      - name: Check out data repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DATA_REPO }}
          ref: ${{ env.DATA_REPO_BRANCH }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: ${{ env.DATA_REPO_DIR }}

      - name: Resolve country code
        run: |
          set -euo pipefail

          if [ -z "${COUNTRY_CODE_INPUT:-}" ]; then
            echo "No country code given, using the countries from config.json."
            exit 0
          fi

          code="$(printf '%s' "$COUNTRY_CODE_INPUT" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if ! printf '%s' "$code" | grep -Eq '^[a-z]{2}$'; then
            echo "::error::country code must be a two-letter ISO 3166-1 code, got '${COUNTRY_CODE_INPUT}'"
            exit 1
          fi

          echo "COUNTRY_CODE=$code" >> "$GITHUB_ENV"
          echo "Country code: $code"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Fetch datapacks
        # Write straight into the data-repository checkout; the worker's own
        # JSON files are gitignored, so nothing data-related lands here.
        env:
          OUTPUT_DIR: ${{ env.DATA_REPO_DIR }}
        run: npm run fetch

      - name: Commit refreshed data
        if: ${{ inputs.commit != false }}
        run: |
          set -euo pipefail

          cd "${DATA_REPO_DIR}"

          changed="$(git status --porcelain -- '*-cameras.json' '*-areas.json' | cut -c4-)"
          if [ -z "$changed" ]; then
            echo "No data changes to commit."
            exit 0
          fi

          # Every file carries the OSM snapshot date it was built from.
          details=""
          version=""
          for file in $changed; do
            file_version="$(node -p "require('./${file}').version")"
            details="${details}${file}: ${file_version}"$'\n'
            if [ -z "$version" ] || [[ "$file_version" > "$version" ]]; then
              version="$file_version"
            fi
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*-cameras.json' '*-areas.json'

          # Countries can sit on different snapshots: the subject carries the
          # newest version, and the body lists every file when they disagree.
          if [ "$(printf '%s' "$details" | awk -F': ' '{print $2}' | sort -u | wc -l)" -gt 1 ]; then
            git commit -m "Updated to version ${version}" -m "$(printf '%s' "$details" | sed '/^$/d; s/^/- /')"
          else
            git commit -m "Updated to version ${version}"
          fi

          # Another run may have pushed in the meantime: rebase onto the remote
          # branch and retry before giving up.
          for attempt in 1 2 3; do
            if git pull --rebase origin "${DATA_REPO_BRANCH}" && git push origin "HEAD:${DATA_REPO_BRANCH}"; then
              echo "Pushed to ${DATA_REPO}@${DATA_REPO_BRANCH}."
              exit 0
            fi

            echo "::warning::push to ${DATA_REPO}@${DATA_REPO_BRANCH} failed (attempt ${attempt}/3), retrying"
            sleep 5
          done

          echo "::error::could not push to ${DATA_REPO}@${DATA_REPO_BRANCH}"
          exit 1

      - name: Summarise result
        run: |
          cd "${DATA_REPO_DIR}"

          {
            echo "### Speed camera data (${COUNTRY_CODE:-all configured countries})"
            echo
            for file in $(ls -1 ./*-cameras.json ./*-areas.json 2>/dev/null | xargs -n1 basename); do
              if [ -f "$file" ]; then
                echo "- \`$file\`: $(node -e "const p=require('./$file'); console.log(p.data.features.length + ' features, version ' + p.version)")"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
